# Test coverage; the job fails below the 85 percent target of the brief
# (Section 10.3).
name: test-coverage

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    env:
      GITHUB_PAT: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4

      - uses: r-lib/actions/setup-r@v2
        with:
          use-public-rspm: true

      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr
          needs: coverage

      - name: Coverage
        run: |
          cov <- covr::package_coverage(quiet = FALSE, clean = FALSE)
          print(cov, group = "filename")
          pct <- covr::percent_coverage(cov)
          cat(sprintf("\nTotal coverage: %.1f%%\n", pct))
          if (pct < 85) stop(sprintf("Coverage %.1f%% is below 85%%", pct))
        shell: Rscript {0}
